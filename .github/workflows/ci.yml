name: ci
on:
  push: { branches: [main, mvp] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix: { node: ["22", "24"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.2.19" }
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
      - run: bunx tsc --noEmit -p tsconfig.json
      - run: node --test --experimental-test-coverage --test-coverage-include='src/**' --test-coverage-exclude='src/index.ts' --test-coverage-lines=80 --test-timeout=30000 'test/*.test.ts'
      # Fails on any high/critical advisory except the dated, documented acceptances in
      # scripts/audit.ts (no silent `|| true`).
      - run: node scripts/audit.ts
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.2.19" }
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: PW_CHANNEL= PW_DISABLE_TS_ESM=1 bunx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: test-results }
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t arag-doc-processing:ci .
      - name: smoke the image against the mock ARAG
        run: |
          docker run -d --name dip -p 8080:8080 -e ARAG_MOCK=1 -e ADMIN_TOKEN=ci arag-doc-processing:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break || sleep 1; done
          curl -fsS http://127.0.0.1:8080/api/v1/openapi.json > /dev/null
          docker rm -f dip
